<svg xmlns="http://www.w3.org/2000/svg" width="820" height="244" viewBox="0 0 820 244" role="img" aria-labelledby="t-hardware-bandwidth" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t-hardware-bandwidth">GPU memory bandwidth</title><rect x="0.5" y="0.5" width="819" height="243" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start" style="">GPU memory bandwidth</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start" style="">GB/s. Writing each token reads the model weights from this memory, so it caps generation speed.</text><line x1="324.0" y1="70.0" x2="324.0" y2="182.0" stroke="#383835" stroke-width="1"/><text x="324.0" y="200.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">0</text><line x1="402.8" y1="70.0" x2="402.8" y2="182.0" stroke="#2c2c2a" stroke-width="1"/><text x="402.8" y="200.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">100</text><line x1="481.6" y1="70.0" x2="481.6" y2="182.0" stroke="#2c2c2a" stroke-width="1"/><text x="481.6" y="200.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">200</text><line x1="560.4" y1="70.0" x2="560.4" y2="182.0" stroke="#2c2c2a" stroke-width="1"/><text x="560.4" y="200.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">300</text><line x1="639.2" y1="70.0" x2="639.2" y2="182.0" stroke="#2c2c2a" stroke-width="1"/><text x="639.2" y="200.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">400</text><line x1="718.0" y1="70.0" x2="718.0" y2="182.0" stroke="#2c2c2a" stroke-width="1"/><text x="718.0" y="200.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">500</text><text x="312.0" y="88.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 3070 · 8 GB</text><path d="M324.0,76.0 H673.0 A4.0,4.0 0 0 1 677.0,80.0 V88.0 A4.0,4.0 0 0 1 673.0,92.0 H324.0 Z" fill="#3987e5"/><text x="683.0" y="88.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">448 GB/s</text><text x="312.0" y="116.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 2060 · 6 GB</text><path d="M324.0,104.0 H584.8 A4.0,4.0 0 0 1 588.8,108.0 V116.0 A4.0,4.0 0 0 1 584.8,120.0 H324.0 Z" fill="#3987e5"/><text x="594.8" y="116.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">336 GB/s</text><text x="312.0" y="144.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">GTX 1050 Ti · 4 GB</text><path d="M324.0,132.0 H408.3 A4.0,4.0 0 0 1 412.3,136.0 V144.0 A4.0,4.0 0 0 1 408.3,148.0 H324.0 Z" fill="#3987e5"/><text x="418.3" y="144.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">112 GB/s</text><text x="312.0" y="172.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">Apple M3 · 24 GB unified</text><path d="M324.0,160.0 H398.8 A4.0,4.0 0 0 1 402.8,164.0 V172.0 A4.0,4.0 0 0 1 398.8,176.0 H324.0 Z" fill="#3987e5"/><text x="408.8" y="172.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">100 GB/s</text><text x="24.0" y="220.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">Manufacturer figures. In a layer split, the slowest GPU that holds a big share of the model sets the pace.</text></svg>
