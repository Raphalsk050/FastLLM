c: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2.7 tok/s</text><text x="342.0" y="528.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 3070 + RTX 2060 + GTX 1050 Ti + M3</text><text x="360.0" y="528.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start" style="" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">not measured: the MacBook was offline</text><text x="24.0" y="564.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" style="">Qwen3.8-Flash-Next UD-Q2_K_XL · 78.9 GB (MoE)</text><text x="38.0" y="587.0" font-size="11.5" font-weight="600" fill="#c3c2b7" text-anchor="start" style="">Single PC</text><text x="342.0" y="606.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 3070 + 64 GB RAM</text><path d="M354.0,594.0 H488.6 A4.0,4.0 0 0 1 492.6,598.0 V606.0 A4.0,4.0 0 0 1 488.6,610.0 H354.0 Z" fill="#d95926"/><text x="498.6" y="606.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">13.3 tok/s</text><text x="38.0" y="635.0" font-size="11.5" font-weight="600" fill="#c3c2b7" text-anchor="start" style="">Cluster</text><text x="342.0" y="654.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 3070 + RTX 2060</text><path d="M354.0,642.0 H451.6 A4.0,4.0 0 0 1 455.6,646.0 V654.0 A4.0,4.0 0 0 1 451.6,658.0 H354.0 Z" fill="#d95926"/><text x="461.6" y="654.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">9.8 tok/s</text><text x="342.0" y="682.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 3070 + GTX 1050 Ti</text><path d="M354.0,670.0 H476.9 A4.0,4.0 0 0 1 480.9,674.0 V682.0 A4.0,4.0 0 0 1 476.9,686.0 H354.0 Z" fill="#d95926"/><text x="486.9" y="682.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">12.2 tok/s</text><text x="342.0" y="710.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 3070 + RTX 2060 + GTX 1050 Ti</text><path d="M354.0,698.0 H415.7 A4.0,4.0 0 0 1 419.7,702.0 V710.0 A4.0,4.0 0 0 1 415.7,714.0 H354.0 Z" fill="#d95926"/><text x="425.7" y="710.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6.3 tok/s</text><text x="342.0" y="738.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">RTX 3070 + RTX 2060 + GTX 1050 Ti + M3</text><text x="360.0" y="738.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start" style="" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">not measured: the MacBook was offline</text><text x="24.0" y="786.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">Main host and single PC: Ryzen 9 5950X, 64 GB RAM, RTX 3070 8 GB. Workers: Ryzen 5 5600X with RTX 2060 6 GB</text><text x="24.0" y="806.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">(12 GB RAM), Pentium G4560 with GTX 1050 Ti 4 GB (8 GB RAM), MacBook Air M3 24 GB on Wi-Fi.</text><text x="24.0" y="826.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">Flash-Next is a mixture-of-experts model (10 of its 512 experts per token). In every setup llama.cpp's automatic</text><text x="24.0" y="846.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">fit left 64-69 GiB of it in the main host's RAM and put only 4-10 GiB on the GPUs, so more machines added network</text><text x="24.0" y="866.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">hops without taking much work off the main host's CPU.</text></svg>
