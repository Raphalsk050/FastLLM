<svg xmlns="http://www.w3.org/2000/svg" width="820" height="216" viewBox="0 0 820 216" role="img" aria-labelledby="t-network-latency" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t-network-latency">Round trip from each worker to the main PC</title><rect x="0.5" y="0.5" width="819" height="215" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start" style="">Round trip from each worker to the main PC</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start" style="">Median ping in milliseconds. The two worker PCs are wired (1 Gbps Ethernet); the MacBook is on Wi-Fi.</text><line x1="324.0" y1="70.0" x2="324.0" y2="154.0" stroke="#c3c2b7" stroke-width="1"/><text x="324.0" y="172.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">0</text><line x1="411.6" y1="70.0" x2="411.6" y2="154.0" stroke="#e1e0d9" stroke-width="1"/><text x="411.6" y="172.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">1</text><line x1="499.1" y1="70.0" x2="499.1" y2="154.0" stroke="#e1e0d9" stroke-width="1"/><text x="499.1" y="172.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">2</text><line x1="586.7" y1="70.0" x2="586.7" y2="154.0" stroke="#e1e0d9" stroke-width="1"/><text x="586.7" y="172.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">3</text><line x1="674.2" y1="70.0" x2="674.2" y2="154.0" stroke="#e1e0d9" stroke-width="1"/><text x="674.2" y="172.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">4</text><text x="312.0" y="88.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end" style="">Ryzen 5 5600X · RTX 2060 · Ethernet</text><path d="M324.0,76.0 H348.0 A4.0,4.0 0 0 1 352.0,80.0 V88.0 A4.0,4.0 0 0 1 348.0,92.0 H324.0 Z" fill="#c3c2b7"/><text x="358.0" y="88.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">0.32 ms</text><text x="312.0" y="116.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end" style="">Pentium G4560 · GTX 1050 Ti · Ethernet</text><path d="M324.0,104.0 H345.4 A4.0,4.0 0 0 1 349.4,108.0 V116.0 A4.0,4.0 0 0 1 345.4,120.0 H324.0 Z" fill="#c3c2b7"/><text x="355.4" y="116.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">0.29 ms</text><text x="312.0" y="144.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end" style="">MacBook Air · Apple M3 · Wi-Fi</text><path d="M324.0,132.0 H668.5 A4.0,4.0 0 0 1 672.5,136.0 V144.0 A4.0,4.0 0 0 1 668.5,148.0 H324.0 Z" fill="#2a78d6"/><text x="678.5" y="144.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3.98 ms</text><text x="24.0" y="192.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">Wi-Fi costs about 13x the latency of a cable. Copying files to the RTX 2060 PC over SSH ran at 90 MB/s.</text></svg>
