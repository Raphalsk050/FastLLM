<svg xmlns="http://www.w3.org/2000/svg" width="820" height="404" viewBox="0 0 820 404" role="img" aria-labelledby="t-hardware-memory" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t-hardware-memory">Memory per machine</title><rect x="0.5" y="0.5" width="819" height="403" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start" style="">Memory per machine</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start" style="">GPU memory and system RAM, in GB. On the MacBook the GPU uses the same 24 GB of unified memory</text><text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start" style="">(up to 17.8 GB), so that pool is not additive.</text><rect x="24" y="92" width="10" height="10" rx="2" fill="#3987e5"/><text x="40.0" y="102.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="">GPU memory</text><rect x="130.0" y="92" width="10" height="10" rx="2" fill="#d95926"/><text x="146.0" y="102.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="">System RAM</text><line x1="324.0" y1="118.0" x2="324.0" y2="342.0" stroke="#383835" stroke-width="1"/><text x="324.0" y="360.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">0</text><line x1="411.6" y1="118.0" x2="411.6" y2="342.0" stroke="#2c2c2a" stroke-width="1"/><text x="411.6" y="360.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">16</text><line x1="499.1" y1="118.0" x2="499.1" y2="342.0" stroke="#2c2c2a" stroke-width="1"/><text x="499.1" y="360.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">32</text><line x1="586.7" y1="118.0" x2="586.7" y2="342.0" stroke="#2c2c2a" stroke-width="1"/><text x="586.7" y="360.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">48</text><line x1="674.2" y1="118.0" x2="674.2" y2="342.0" stroke="#2c2c2a" stroke-width="1"/><text x="674.2" y="360.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">64</text><text x="38.0" y="137.0" font-size="11.5" font-weight="600" fill="#c3c2b7" text-anchor="start" style="">Single PC (also the cluster's main host)</text><text x="312.0" y="165.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">Ryzen 9 5950X · RTX 3070</text><path d="M324.0,144.0 H363.8 A4.0,4.0 0 0 1 367.8,148.0 V156.0 A4.0,4.0 0 0 1 363.8,160.0 H324.0 Z" fill="#3987e5"/><text x="373.8" y="156.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8 GB</text><path d="M324.0,162.0 H670.2 A4.0,4.0 0 0 1 674.2,166.0 V174.0 A4.0,4.0 0 0 1 670.2,178.0 H324.0 Z" fill="#d95926"/><text x="680.2" y="174.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">64 GB</text><text x="38.0" y="203.0" font-size="11.5" font-weight="600" fill="#c3c2b7" text-anchor="start" style="">Cluster workers</text><text x="312.0" y="231.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">Ryzen 5 5600X · RTX 2060</text><path d="M324.0,210.0 H352.8 A4.0,4.0 0 0 1 356.8,214.0 V222.0 A4.0,4.0 0 0 1 352.8,226.0 H324.0 Z" fill="#3987e5"/><text x="362.8" y="222.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6 GB</text><path d="M324.0,228.0 H385.7 A4.0,4.0 0 0 1 389.7,232.0 V240.0 A4.0,4.0 0 0 1 385.7,244.0 H324.0 Z" fill="#d95926"/><text x="395.7" y="240.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">12 GB</text><text x="312.0" y="277.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">Pentium G4560 · GTX 1050 Ti</text><path d="M324.0,256.0 H341.9 A4.0,4.0 0 0 1 345.9,260.0 V268.0 A4.0,4.0 0 0 1 341.9,272.0 H324.0 Z" fill="#3987e5"/><text x="351.9" y="268.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4 GB</text><path d="M324.0,274.0 H363.8 A4.0,4.0 0 0 1 367.8,278.0 V286.0 A4.0,4.0 0 0 1 363.8,290.0 H324.0 Z" fill="#d95926"/><text x="373.8" y="286.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8 GB</text><text x="312.0" y="323.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end" style="">MacBook Air · Apple M3</text><path d="M324.0,302.0 H417.4 A4.0,4.0 0 0 1 421.4,306.0 V314.0 A4.0,4.0 0 0 1 417.4,318.0 H324.0 Z" fill="#3987e5"/><text x="427.4" y="314.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">17.8 GB</text><path d="M324.0,320.0 H451.3 A4.0,4.0 0 0 1 455.3,324.0 V332.0 A4.0,4.0 0 0 1 451.3,336.0 H324.0 Z" fill="#d95926"/><text x="461.3" y="332.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#1a1a19" stroke-width="4" stroke-linejoin="round" paint-order="stroke">24 GB</text><text x="24.0" y="380.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">Windows 11 on the Ryzen PCs, Linux on the Pentium PC, macOS on the MacBook.</text></svg>
