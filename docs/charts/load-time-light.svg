<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="t-load-time" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t-load-time">Time until the server is ready</title><rect x="0.5" y="0.5" width="819" height="319" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start" style="">Time until the server is ready</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start" style="">Seconds. The first load sends the weights over the network; later loads reuse each worker's disk cache.</text><rect x="24" y="72" width="10" height="10" rx="2" fill="#2a78d6"/><text x="40.0" y="82.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="">First load</text><rect x="130.0" y="72" width="10" height="10" rx="2" fill="#eb6834"/><text x="146.0" y="82.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="">With the worker cache</text><line x1="324.0" y1="98.0" x2="324.0" y2="218.0" stroke="#c3c2b7" stroke-width="1"/><text x="324.0" y="236.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">0</text><line x1="402.8" y1="98.0" x2="402.8" y2="218.0" stroke="#e1e0d9" stroke-width="1"/><text x="402.8" y="236.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">100</text><line x1="481.6" y1="98.0" x2="481.6" y2="218.0" stroke="#e1e0d9" stroke-width="1"/><text x="481.6" y="236.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">200</text><line x1="560.4" y1="98.0" x2="560.4" y2="218.0" stroke="#e1e0d9" stroke-width="1"/><text x="560.4" y="236.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">300</text><line x1="639.2" y1="98.0" x2="639.2" y2="218.0" stroke="#e1e0d9" stroke-width="1"/><text x="639.2" y="236.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">400</text><line x1="718.0" y1="98.0" x2="718.0" y2="218.0" stroke="#e1e0d9" stroke-width="1"/><text x="718.0" y="236.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums;">500</text><text x="312.0" y="125.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end" style="">Qwen3-14B · RTX 3070 + RTX 2060</text><path d="M324.0,104.0 H383.0 A4.0,4.0 0 0 1 387.0,108.0 V116.0 A4.0,4.0 0 0 1 383.0,120.0 H324.0 Z" fill="#2a78d6"/><text x="393.0" y="116.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">80 s</text><path d="M324.0,122.0 H331.0 A4.0,4.0 0 0 1 335.0,126.0 V134.0 A4.0,4.0 0 0 1 331.0,138.0 H324.0 Z" fill="#eb6834"/><text x="341.0" y="134.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">14 s</text><text x="312.0" y="171.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end" style="">Qwen3-32B · all four machines</text><path d="M324.0,150.0 H619.4 A4.0,4.0 0 0 1 623.4,154.0 V162.0 A4.0,4.0 0 0 1 619.4,166.0 H324.0 Z" fill="#2a78d6"/><text x="629.4" y="162.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">380 s</text><path d="M324.0,168.0 H359.4 A4.0,4.0 0 0 1 363.4,172.0 V180.0 A4.0,4.0 0 0 1 359.4,184.0 H324.0 Z" fill="#eb6834"/><text x="369.4" y="180.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">50 s</text><text x="312.0" y="208.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end" style="">Qwen3.8-Flash-Next · all four machines</text><path d="M324.0,196.0 H666.7 A4.0,4.0 0 0 1 670.7,200.0 V208.0 A4.0,4.0 0 0 1 666.7,212.0 H324.0 Z" fill="#2a78d6"/><text x="676.7" y="208.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums;" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round" paint-order="stroke">440 s</text><text x="24.0" y="256.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">All four machines: RTX 3070, RTX 2060, GTX 1050 Ti and MacBook Air M3 (Wi-Fi). First loads of 14B and 32B are</text><text x="24.0" y="276.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">llama-bench runs minus the benchmark itself. The 32B cached reload sent only 0.3 GB over the network.</text><text x="24.0" y="296.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="">Flash-Next's cached reload was not measured.</text></svg>
